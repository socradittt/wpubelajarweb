<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Box Model</title>
    <style>

        *{
            /* Universal Selector = Menyeleksi semua elemen dalam dokumen */
            margin: 0;
            /* Mengatur jarak di luar elemen */
            padding: 0;
            /* Mengatur jarak di dalam elemen */
        }

        .kotak1 {
            width: 300px;
            height: 300px;
            background-color: lightblue;
            margin-top: 30px;
            /* margin-right:auto;
            margin-bottom: 40px;
            margin-left: auto; */
            /* margin: 50px; ke-4 sisi akan memiliki jarak 50px */
            /* margin: 50px auto; */
            /* atas dan bawah 50px, kiri dan kanan auto */
            /* margin: 50px auto 100px; */
            /* atas 50px, kiri dan kanan auto, bawah 100px */
            margin: 10px 20px 30px 40px;
            /* atas 10px, kanan 20px, bawah 30px, kiri 40px */
            /*auto = Mengatur jarak secara otomatis agar elemen berada di tengah */
            /* Margin = Mengatur jarak di luar elemen */
            /* margin minus (-) = Mengatur jarak dengan nilai negatif */
            padding-top: 50px;
            /* padding-top: 50px; disini akan mempengaruhi jarak antara isi elemen dengan border bagian atas, sehingga isi elemen akan turun ke bawah sejauh 50px */
            padding-left: 50px;
            /* padding-left: 50px; disini akan mempengaruhi jarak antara isi elemen dengan border bagian kiri, sehingga isi elemen akan bergeser ke kanan sejauh 50px */
            padding: 50px;
            /* padding: 50px; ke-4 sisi akan memiliki jarak 50px antara isi elemen dengan border */
        }

        .kotak2{
            width: 200px;
            height: 200px;
            background-color: salmon;
            margin-top: 20px;
            /*margin-top: 20px; disini tidak akan mempengaruhi jarak lagi karena sudah diatur dengan margin-bottom pada kotak1 yang memiliki jarak 30px, sehingga jarak antara kotak1 dan kotak2 tetap 30px overlapping margin (margin yang lebih besar dia yang menang) */
            margin-top: -50px;
             /* margin-top: -50px; disini akan mempengaruhi jarak antara kotak1 dan kotak2 menjadi -20px, sehingga kotak2 akan naik ke atas dan menumpuk dengan kotak1 */
            
        }
    </style>

</head>
<body>
    <div class="kotak1">1</div>
    <div class="kotak2">2</div>
</body>
</html>
