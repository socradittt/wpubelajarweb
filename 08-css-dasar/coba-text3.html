<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coba Text - Text Overflow & Text Shadow</title>
  <style>
    p {
      font-size: 28px;
      white-space: nowrap;
      width: 300px;
      background-color: lightblue;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    h1 {
      font-size: 100px;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      /* text-shadow: 2px 2px 3px gray, 0px -10px 5px red */
      text-shadow: 5px 5px o gray;
      text-decoration: underline;
      text-decoration-style: wavy;
      text-decoration-color: lightblue;
      text-decoration-skip-ink: none;
    }
  </style>
  <h1>Hello, CSS!</h1>
