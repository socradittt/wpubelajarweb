<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quote Filsuf</title>
  <style>
    body {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      color: #CAD3DF;
      text-align: center;
      background-color: #008b8b
    }

    h1 {
      color: #CAD3DF;
      font-size: 46px;
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: 10px;
      text-decoration: underline;
      text-decoration-style: wavy;
      text-decoration-color: rgb(100, 100, 100);
      text-shadow: 5px 5px 0 rgb(150 147 147 / 10%);
    }

    .quote {
      font-size: 22px;
      line-height: 2.2;
      word-spacing: 10px;
      /* jarak antar kata */
    }

    span {
      color: crimson;
      wtext-decoration: line-through;
    }

    .author {
      font-weight: normal;
      color: rgb(206 206 206 / 80%);
      font-size: 12px;
      letter-spacing: 2px;

    }
  </style>
</head>

<body>
  <h1>God Is Dead</h1>
  <p class="quote">He who has a why <br> for <span>witch</span> to live can bear <br>with almost any how"</p>

  <p class="author">-Friedrich Nietzsche</p>
</body>

</html>
