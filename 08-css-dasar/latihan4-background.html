<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quote Filsuf</title>
  <style>
    body {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      color: #CAD3DF;
      text-align: center;
      background-color: #008b8b;
      background-image: linear-gradient(to bottom, rgb(15 23 42 / 90%) 50%, rgb(15 23 42 / 40%)), url('https://fastly.picsum.photos/id/10/1000/1000.jpg?hmac=8imXWM_Cxe6_cWjyUbT2Vh7oxwiz12HfzJHp6CLoGwM');
      /* Ambil foto dari website https://picsum.photos/ */
      background-size: cover;
      /*menutup selayar penuh background image */
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
    }

    h1 {
      color: #0e76ff;
      font-size: 46px;
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: 10px;
      /* text-shadow: 5px 5px 0 rgb(150 147 147 / 10%); */
      background-image: linear-gradient(to right, rgb(59, 59, 253), rgb(224, 33, 224));
      background-clip: text;
      /*linear-gardient Akan menempel dengan text*/
      color: transparent;
      filter: drop-shadow(0 0 10px rgba(102, 222, 249, 0.5));
      /* Membuat efek shadow di text */
    }

    .quote {
      font-size: 22px;
      line-height: 2.2;
      word-spacing: 10px;
      /* jarak antar kata */
      background-color: rgb(255 255 255 / 5%);
      max-width: 600px;
      margin: auto;
      padding: 20px;
      /* jarak antara konten ke dindingnya */
      border-radius: 20px;
      /* tikungan di siku dinding */
      border: 1px solid rgb(255 255 255 / 10%);
      /* efek warna di siku dinding */
      box-shadow: 0 10px 30px rgb(0 0 0 / 50%);
      /* membuat bayangan dibelakang konten  */
    }

    span {
      color: crimson;
      text-decoration: none;
      text-shadow: 0 0 10px rgb(243, 50, 89);
    }

    .author {
      font-weight: normal;
      color: rgb(206 206 206 / 80%);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-top: 1px solid rgb(255 255 255 / 20%);
      width: 25%;
      margin: 30px auto;
      padding-top: 20px;
    }
  </style>
</head>

<body>
  <h1>God Is Dead</h1>
  <p class="quote">He who has a why <br> for <span>witch</span> to live can bear <br>with almost any how"</p>

  <p class="author">-Friedrich Nietzsche</p>
</body>

</html>
