<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coba Form</title>
</head>

<body>
  <h1>Contoh Elemen-elemen form pada HTML</h1>

  <form>
    <label for="nama">Nama
      <input type="text" name="nama" placeholder="Masukkan nama" id="nama">
    </label>
    <br>
    <label for="password">password
      <input type="password" name="password" id="password">
    </label>

    <br>

    <label for="email">Email:
      <input type="email" name="email" id="email">
    </label>
    <br>

    <label for="angka">Angka:
      <input type="number" name="number" id="number" min="0" max="100" step="2">
    </label>
    <br>

    <label for="Tanggal">Tanggal:
      <input type="date" name="Tanggal" id="Tanggal">
    </label>
    <br>

    <label for="Warna"> Pilih Warna:
      <input type="color" name="Warna" id="Warna">
    </label>
    <br>

    <label for="file">file
      <input type="file" name="file" id="file">
    </label>

    <br>
    <button>KIRIM!</button>
  </form>
</body>

</html>
